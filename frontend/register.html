<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Регистрация | Wedding AI Planner</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <section class="auth-section">
    <div class="auth-card">
      <h1>Създай профил</h1>

      <p>
        Регистрирайте се, за да запазвате AI разговорите
        и сватбените си концепции.
      </p>

      <form id="registerForm" class="auth-form">
        <input
          type="text"
          id="fullName"
          placeholder="Име и фамилия"
          autocomplete="name"
          required
        >

        <input
          type="email"
          id="email"
          placeholder="Имейл адрес"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Парола"
          autocomplete="new-password"
          required
        >

        <button type="submit">Регистрация</button>
      </form>

      <div id="registerMessage"></div>
    </div>
  </section>

  <script src="js/register.js"></script>
</body>
</html>
